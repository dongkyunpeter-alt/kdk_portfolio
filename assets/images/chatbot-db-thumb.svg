<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chatbot DB project preview</title>
  <desc id="desc">A warm-toned AI chatbot interface with a session sidebar and conversation panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2e5"/>
      <stop offset="1" stop-color="#e9dcc2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#7b6b4d" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <rect x="74" y="70" width="1452" height="760" rx="38" fill="#fffdf8" fill-opacity=".78" stroke="#332e25" stroke-opacity=".12"/>
  <rect x="104" y="103" width="318" height="694" rx="28" fill="#faf8f0" stroke="#332e25" stroke-opacity=".1"/>
  <text x="145" y="170" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#29251e">✦ mong</text>
  <rect x="136" y="204" width="254" height="55" rx="15" fill="#29251e"/>
  <text x="190" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fffdf5">＋  새 대화</text>
  <text x="145" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#9a907d">내 대화</text>
  <rect x="132" y="337" width="260" height="50" rx="13" fill="#e9e2cf"/>
  <text x="153" y="369" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#393328">편의점 광고 아이디어</text>
  <text x="153" y="430" font-family="Arial, sans-serif" font-size="18" fill="#645b4d">새로운 대화</text>
  <text x="153" y="477" font-family="Arial, sans-serif" font-size="18" fill="#645b4d">프로젝트 정리</text>
  <text x="145" y="750" font-family="Arial, sans-serif" font-size="15" fill="#9a907d">AI와 편안하게 대화해 보세요.</text>
  <g filter="url(#shadow)">
    <rect x="468" y="103" width="1018" height="694" rx="30" fill="#fffefa" stroke="#332e25" stroke-opacity=".1"/>
  </g>
  <text x="520" y="168" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#e16a4a">AI COMPANION</text>
  <text x="520" y="218" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#29251e">무엇을 도와드릴까요?</text>
  <rect x="1282" y="151" width="130" height="38" rx="19" fill="#f8f4ea" stroke="#332e25" stroke-opacity=".1"/>
  <circle cx="1305" cy="170" r="6" fill="#7cae69"/>
  <text x="1321" y="177" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#756d5e">온라인</text>
  <circle cx="956" cy="370" r="47" fill="#ed7654"/>
  <text x="945" y="385" font-family="Arial, sans-serif" font-size="35" fill="#fffdf5">✦</text>
  <text x="832" y="472" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#e16a4a">READY WHEN YOU ARE</text>
  <text x="777" y="535" font-family="Arial, sans-serif" font-size="39" font-weight="800" fill="#29251e">가볍게, 무엇이든</text>
  <text x="850" y="582" font-family="Arial, sans-serif" font-size="39" font-weight="800" fill="#29251e">물어보세요.</text>
  <text x="797" y="622" font-family="Arial, sans-serif" font-size="18" fill="#817968">대화 기록을 SQLite에 저장하고 이어서 대화할 수 있어요.</text>
  <rect x="554" y="708" width="850" height="52" rx="18" fill="#fffefa" stroke="#332e25" stroke-opacity=".16"/>
  <text x="584" y="741" font-family="Arial, sans-serif" font-size="17" fill="#aaa18d">무엇이든 물어보세요</text>
  <circle cx="1367" cy="734" r="19" fill="#29251e"/>
  <text x="1360" y="742" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fffdf5">↑</text>
</svg>
